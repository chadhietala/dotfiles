[general]
framerate=30
bars=8
# Background Music currently exposes an 8 kHz capture stream, so this must
# remain below its 4 kHz Nyquist limit or Cava exits at startup.
higher_cutoff_freq=3500
[input]
method = portaudio
source = "Background Music"
[output]
method=raw
data_format=ascii
ascii_max_range=8
bar_delimiter=32
channels=mono
mono_option=average
