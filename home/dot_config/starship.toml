command_timeout = 700

format = """
$username\
$hostname\
$localip\
$shlvl\
$singularity\
$kubernetes\
$directory\
$vcsh\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
${custom.git_status}\
${custom.jj}\
$hg_branch\
$docker_context\
$buf\
$cmake\
$container\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$env_var\
$crystal\
$custom\
$sudo\
$cmd_duration\
$line_break\
$jobs\
$battery\
$time\
$status\
$shell\
$character"""

[battery]
disabled=true

[buf]
disabled=true

[directory]
style="bold blue"
fish_style_pwd_dir_length=1
truncate_to_repo=false

[git_branch]
disabled=true
style="bold cyan"

[cmd_duration]
disabled=true

[python]
format="via [${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"

[custom.git_branch]
ignore_timeout = true
when = true
# command = "jj root >/dev/null 2>&1 || starship module git_branch"
command = "starship module git_branch"
description = "Only show git_branch if we're not in a jj repo"

[custom.git_status]
when = true
ignore_timeout = true
# command = "jj root >/dev/null 2>&1 || starship module git_status"
command = "starship module git_status"
description = "Only show git_status if we're not in a jj repo"
format = "($output )"

