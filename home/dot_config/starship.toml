[custom.jj]
command = "prompt"
format = "$output"
ignore_timeout = true
shell = ["starship-jj", "--ignore-working-copy", "starship"]
use_stdin = false
when = true


[git_state]
disabled = true

[git_commit]
disabled = true

[git_metrics]
disabled = true
