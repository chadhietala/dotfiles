# Reference: https://github.com/i3/i3/blob/next/etc/config

# Start AeroSpace at login
start-at-login = true

after-startup-command = [
    # Colors/width live in ~/.config/theme/theme.sh, shared with sketchybar
    'exec-and-forget ~/.config/aerospace/start-borders.sh',
    # Run Sketchybar together with AeroSpace
    # sketchbar has a built-in detection of already running process,
    # so it won't be run twice on AeroSpace restart
    'exec-and-forget sketchybar'
]

# Notify Sketchybar about workspace change
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Keep the theme picker floating instead of being tiled into the grid
on-window-detected = [
    {
        if = 'test %{window-title} = "Theme Picker"',
        run = ['layout floating'],
    },
]

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = 'qwerty'

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 16
inner.vertical =   16
outer.left =       16
outer.bottom =     16
outer.top =        60
outer.right =      16


[mode.main.binding]

    # Disable "hide application" shortcuts
    alt-h = [] # Disable "hide application"
    cmd-alt-h = [] # Disable "hide others"

    alt-left     =   'focus --boundaries-action wrap-around-the-workspace left'
    alt-down     =   'focus --boundaries-action wrap-around-the-workspace down'
    alt-up       =   'focus --boundaries-action wrap-around-the-workspace up'
    alt-right    =   'focus --boundaries-action wrap-around-the-workspace right'

    alt-shift-left = 'move left'
    alt-shift-down = 'move down'
    alt-shift-up = 'move up'
    alt-shift-right = 'move right'


    alt-equal = ['resize width +32']
    alt-minus = ['resize width -32']
    alt-shift-equal = ['resize height +32']
    alt-shift-minus = ['resize height -32']

    alt-j = 'layout horizontal vertical'
    alt-f = 'fullscreen'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    alt-pageUp = ['workspace prev']
    alt-pageDown = ['workspace next']

    alt-home = ['workspace 1']
    alt-end = ['workspace 5']

    alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
    alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
    alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
    alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
    alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
    alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
    alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
    alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
    alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'

    alt-shift-c = 'reload-config'

    # Reset view to default split
    alt-ctrl-alt-shift-d = 'flatten-workspace-tree'

    # Floating window
    alt-ctrl-alt-shift-f = 'layout floating tiling'

    # Modes
    alt-ctrl-alt-shift-m = 'mode merge'
    alt-ctrl-alt-shift-w = 'mode workspace'
    alt-ctrl-alt-shift-r = 'mode resize'


[mode.merge.binding]
    space = 'mode main'
    esc = 'mode main'

    left = ['join-with left', 'mode main']
    down = ['join-with down', 'mode main']
    up = ['join-with up', 'mode main']
    right = ['join-with right', 'mode main']


[mode.resize.binding]
    space = 'mode main'
    esc = 'mode main'

    left = ['resize width -16']
    down = ['resize height -16']
    up = ['resize height +16']
    right = ['resize width +16']

    shift-left = ['resize width -64']
    shift-down = ['resize height -64']
    shift-up = ['resize height +64']
    shift-right = ['resize width +64']


[mode.workspace.binding]
    space = 'mode main'
    esc = 'mode main'

    left = ['workspace prev', 'move-mouse window-force-center']
    right = ['workspace next', 'move-mouse window-force-center']
    up = ['focus-monitor prev', 'move-mouse window-force-center']
    down = ['focus-monitor next', 'move-mouse window-force-center']
    
    shift-right = ['move-node-to-workspace next --focus-follows-window']
    shift-left = ['move-node-to-workspace prev --focus-follows-window']
    shift-up = ['move-node-to-monitor prev --focus-follows-window']
    shift-down = ['move-node-to-monitor next --focus-follows-window']



#
# Application-specific configurations
#

[[on-window-detected]]
if.app-name-regex-substring = 'Code - Insiders|Cursor|Simulator|Warp|Xcode|VSCode'
run = ['layout tiling', 'move-node-to-workspace 2']

[[on-window-detected]]
if.app-name-regex-substring = 'Ghostty|iTerm|terminal'
run = ['layout tiling', 'move-node-to-workspace 3']

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = "move-node-to-workspace 1"

[[on-window-detected]]
if.app-name-regex-substring = 'Slack'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = ['layout tiling', 'move-node-to-workspace 4']

[[on-window-detected]]
if.app-name-regex-substring = 'finder'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.AppStore'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.clock'
run = 'layout floating'
